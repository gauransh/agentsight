# Mirrors the session-capture image from GHCR into the EKS account's ECR.
#
# The copy itself is the Sandbox Engine's reusable mirror-ecr.yml
# (`workflow_call`); this file carries only this repo's trigger, image and
# secrets. The ECR repository (agent-sandbox/session-capture) is tag-IMMUTABLE.
# The validate job permits only sha-<7..40 hex> tags before any credentials
# are requested. The floating `main` tag remains a GHCR-only convenience.
#
# ECR auth: set the AWS_ECR_MIRROR_ROLE_ARN repository secret to an OIDC role
# and no password refresh is needed. Until then ECR_MIRROR_TOKEN is a
# short-lived (12 h) ECR password; refresh it right before dispatching:
#
#   gh secret set ECR_MIRROR_TOKEN -R <owner>/agentsight \
#     --body "$(aws ecr get-login-password --region us-east-2)"
#   gh workflow run mirror-ecr.yml -f tag=sha-<short7>
name: mirror-ecr

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to mirror (docker/metadata-action sha format, e.g. sha-1adbcd0)"
        required: true

concurrency: mirror-ecr

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a commit-derived image tag
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^sha-[0-9a-f]{7,40}$ ]]; then
            echo "::error::tag must be sha- followed by 7 to 40 lowercase hex characters"
            exit 1
          fi

  mirror:
    needs: validate
    # Exact sandbox main commit where the reusable workflow is present. The
    # former #337 head pin resolves as Git data but GitHub Actions rejects it
    # with 422 because the reusable workflow is not available at that ref.
    uses: gauransh/itsm-sandbox-policy-engine/.github/workflows/mirror-ecr.yml@d8b7803115756219a138c54ae21fc0f640a60562
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      images: session-capture
      tag: ${{ inputs.tag }}
      aws_account_id: "335971291626"
    secrets:
      aws_role_to_assume: ${{ secrets.AWS_ECR_MIRROR_ROLE_ARN }}
      ecr_password: ${{ secrets.ECR_MIRROR_TOKEN }}
      ghcr_token: ${{ secrets.GITHUB_TOKEN }}
